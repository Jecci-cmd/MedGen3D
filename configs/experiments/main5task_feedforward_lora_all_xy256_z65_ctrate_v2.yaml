defaults:
  - ../data/main5task_xy256_z65.yaml
  - ../model/wan22_ti2v_5b.yaml
  - ../train/main5task_feed_forward_10k_best.yaml
  - ../train/main5task_feed_forward_lora_all.yaml

experiment:
  name: medgen3d_main5task_lora_all_xy256_z65_ctrate_v2
  tasks: [segmentation, restoration, reconstruction, synthesis, generation]
  task_sampling_ratio: {segmentation: 1.0, restoration: 1.0, reconstruction: 1.0, synthesis: 1.0, generation: 1.0}

data:
  # Created by scripts/prepare_ctrate_v2.py.  This is intentionally a new
  # directory; do not overwrite ctrate_report_ct_xy256.
  volume_tasks:
    generation:
      root: /inspire/qb-ilm/project/video-generation/public/lijiaxi/MedGen3D-main/data/ctrate_report_ct_v2
      manifests: {train: manifests/train.jsonl, val: manifests/val.jsonl, test: manifests/test.jsonl}
      expected_split_counts: {train: 1000, val: 100, test: 200}
      spatial_flip_probability: 0.0

model:
  probe_input_shape: [1, 1, 65, 256, 256]

train:
  finetuning:
    mode: lora_all_linear
    rank: 16
    alpha: 32
    dropout: 0.05
  optimizer:
    zero_redundancy: false
    learning_rate: 1.0e-4
    new_module_learning_rate: 1.0e-4
    new_module_patterns: [condition_patch_embedding, view_embedding, position_embedding]

evaluation:
  segmentation: [dice, nsd, hd95, assd]
  restoration: [mae_hu, rmse_hu, psnr_hu, ssim]
  reconstruction: [mae_hu, rmse_hu, psnr_hu, ssim]
  synthesis: [mae, psnr, ssim]
  generation: [fid, fvd_i3d, ct_clip_t2i, ct_clip_i2i]
